<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>内网直传 · 专业修复版</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b1120;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #e2e8f0;
        }
        .app-container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .advanced-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            color: #a5b4fc;
            transition: 0.2s;
            z-index: 10;
        }
        .advanced-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 20px;
            margin-top: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .advanced-panel.show { display: block; }
        .server-config, .stun-config {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
        }
        .server-config input, .stun-config input {
            flex: 1;
            background: #020617;
            border: 1px solid #475569;
            color: white;
            padding: 12px 16px;
            border-radius: 40px;
        }
        .log-box {
            background: #020617;
            border-radius: 16px;
            padding: 14px;
            font-size: 0.75rem;
            color: #b0c8e8;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .main-actions {
            display: flex;
            gap: 16px;
            margin: 30px 0 20px;
        }
        .action-card {
            flex: 1;
            background: #0f172a;
            border-radius: 28px;
            padding: 24px 12px;
            text-align: center;
            border: 2px solid #334155;
            cursor: pointer;
            box-shadow: 0 8px 0 #020617;
        }
        .action-card .icon { font-size: 48px; margin-bottom: 12px; }
        .action-card h3 { font-weight: 500; margin-bottom: 6px; }

        .qr-quick-panel {
            background: #0f172a;
            border-radius: 24px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #334155;
            display: none;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            background: #2d3a52;
            border: none;
            color: white;
            padding: 14px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #5f7a9f;
            box-shadow: 0 3px 0 #0f172a;
            font-size: 1rem;
            text-align: center;
            flex: 1;
        }
        .btn-primary { background: #2563eb; }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f172a; }

        #qrcode canvas { max-width: 100%; height: auto; margin: 0 auto; display: block; }
        video { width: 100%; border-radius: 20px; background: #000; }
        .status-badge {
            background: #0f172a;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 8px 0;
        }

        /* 雷达界面 */
        .radar-view {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0b1120;
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .radar-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .radar-svg {
            width: 100%;
            max-width: 400px;
            height: auto;
        }
        .peer-node {
            cursor: pointer;
            transition: 0.2s;
        }
        .peer-node:hover { filter: brightness(1.3); }

        /* 传输助手 */
        .transfer-assistant {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1e293b;
            z-index: 200;
            display: none;
            flex-direction: column;
        }
        .transfer-header {
            background: #0f172a;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .transfer-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            background: #334155;
            align-self: flex-start;
        }
        .message-bubble.self {
            background: #2563eb;
            align-self: flex-end;
        }
        .transfer-input-area {
            background: #0f172a;
            padding: 16px;
            display: flex;
            gap: 12px;
        }
        .transfer-input-area input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 14px;
            border-radius: 40px;
        }
        .file-label {
            background: #2d3a52;
            padding: 14px;
            border-radius: 40px;
            cursor: pointer;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: #1e293b;
            padding: 24px;
            border-radius: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="app-container" id="mainContainer">
    <div class="advanced-btn" id="advancedBtn">⚙️</div>

    <!-- 高级面板 -->
    <div class="advanced-panel" id="advancedPanel">
        <h3>🔧 高级设置</h3>
        <div class="server-config">
            <span>🌐 信令</span>
            <input type="text" id="serverUrl" value="192.168.43.15:8800" placeholder="IP:端口">
            <button class="btn" id="applyServerBtn" style="padding:10px;">应用</button>
        </div>
        <div class="stun-config">
            <span>📡 STUN</span>
            <input type="text" id="stunServer" value="stun:stun.l.google.com:19302" placeholder="stun:stun.l.google.com:19302">
            <button class="btn" id="applyStunBtn" style="padding:10px;">应用</button>
        </div>
        <div class="log-box" id="logBox">📋 日志区域...</div>
    </div>

    <!-- 主界面 -->
    <h1>📡 内网直传</h1>
    <div class="main-actions">
        <div class="action-card" id="qrQuickCard">
            <div class="icon">📷</div>
            <h3>二维码快速连接</h3>
            <p>生成/扫描二维码</p>
        </div>
        <div class="action-card" id="radarCard">
            <div class="icon">🛜</div>
            <h3>内网自动探查</h3>
            <p>雷达式发现设备</p>
        </div>
    </div>

    <!-- 二维码快速连接面板 -->
    <div class="qr-quick-panel" id="qrQuickPanel">
        <h3>选择操作</h3>
        <div class="btn-row">
            <button class="btn btn-primary" id="showGenOfferBtn">🎯 生成 Offer 二维码</button>
            <button class="btn btn-primary" id="showScanBtn">📸 扫描二维码</button>
        </div>
        <button class="btn" id="closeQrPanelBtn" style="margin-top:16px;">返回</button>
    </div>

    <!-- 生成二维码界面 -->
    <div id="genOfferSection" style="display:none;">
        <div style="margin:20px 0;">
            <button class="btn btn-primary" id="genOfferBtn">🔄 刷新二维码</button>
        </div>
        <div id="qrcode"></div>
        <div class="status-badge">ICE: <span id="iceStateR">等待</span> · 连接: <span id="connStateR">新</span></div>
        <button class="btn" id="cancelGenOfferBtn">返回</button>
    </div>

    <!-- 扫描二维码界面 -->
    <div id="scanSection" style="display:none;">
        <button class="btn btn-primary" id="startScanBtn" style="width:100%; margin:20px 0;">📸 开启摄像头扫描</button>
        <video id="video" autoplay playsinline style="display:none;"></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <div id="scanResult" style="color:#a5f3fc; margin:10px 0;">等待扫描...</div>
        <button class="btn" id="cancelScanBtn">返回</button>
    </div>
</div>

<!-- 雷达界面 -->
<div class="radar-view" id="radarView">
    <div class="radar-header" style="display:flex; justify-content:space-between; padding:10px 0;">
        <button class="btn" id="closeRadarBtn" style="padding:8px 20px;">← 返回</button>
        <span>🛜 网络雷达</span>
        <span style="width:60px;"></span>
    </div>
    <div class="radar-container">
        <svg viewBox="0 0 400 400" class="radar-svg" id="radarSvg">
            <circle cx="200" cy="200" r="180" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="5,5"/>
            <circle cx="200" cy="200" r="120" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="5,5"/>
            <circle cx="200" cy="200" r="60" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="5,5"/>
            <circle cx="200" cy="200" r="24" fill="#2563eb" stroke="#60a5fa" stroke-width="3"/>
            <text x="200" y="206" text-anchor="middle" fill="white" font-size="14" font-weight="bold" id="myIdDisplay">---</text>
            <g id="peersGroup"></g>
        </svg>
    </div>
    <div class="radar-footer" style="padding:20px; text-align:center;">
        <p id="radarStatus">正在探查网络...</p>
    </div>
</div>

<!-- 传输助手 -->
<div class="transfer-assistant" id="transferAssistant">
    <div class="transfer-header">
        <button class="btn" id="closeTransferBtn" style="padding:8px 16px;">←</button>
        <h2>📁 文件传输助手</h2>
        <span id="peerIdDisplay"></span>
    </div>
    <div class="transfer-messages" id="messageList">
        <div class="message-bubble">✨ 连接已建立，可以发送文件和消息</div>
    </div>
    <div class="transfer-input-area">
        <label class="file-label" for="fileInput">📎</label>
        <input type="file" id="fileInput" style="display:none;">
        <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
        <button class="btn btn-primary" id="sendMessageBtn" style="padding:14px 24px;">发送</button>
    </div>
</div>

<!-- 通用模态框 -->
<div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-box">
        <h3 id="modalTitle">提示</h3>
        <p id="modalMessage"></p>
        <div class="btn-row" style="margin-top:20px;">
            <button class="btn" id="modalCancelBtn">取消</button>
            <button class="btn btn-primary" id="modalConfirmBtn">确定</button>
        </div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- 全局变量 ----------
        let ws = null, pc = null, dc = null;
        let myId = null, targetId = null;
        let localCandidates = [];
        let role = null; // 'receiver' 或 'sender'
        let receiveBuffer = [], receivedFileName = '', receivedFileSize = 0;
        let serverConnected = false;
        let serverUrl = "192.168.43.15:8800";
        let stunServer = "stun:stun.l.google.com:19302";
        let peerNodes = [];
        let publicIpInfo = null;
        let scanningActive = false;
        let pendingIceCandidates = []; // 缓存早期ICE

        // DOM
        const advancedBtn = document.getElementById('advancedBtn');
        const advancedPanel = document.getElementById('advancedPanel');
        const serverUrlInput = document.getElementById('serverUrl');
        const applyServerBtn = document.getElementById('applyServerBtn');
        const stunServerInput = document.getElementById('stunServer');
        const applyStunBtn = document.getElementById('applyStunBtn');
        const logBox = document.getElementById('logBox');
        const qrQuickPanel = document.getElementById('qrQuickPanel');
        const genOfferSection = document.getElementById('genOfferSection');
        const scanSection = document.getElementById('scanSection');
        const radarView = document.getElementById('radarView');
        const transferAssistant = document.getElementById('transferAssistant');
        const myIdDisplay = document.getElementById('myIdDisplay');
        const peersGroup = document.getElementById('peersGroup');
        const radarStatus = document.getElementById('radarStatus');
        const messageList = document.getElementById('messageList');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const peerIdDisplay = document.getElementById('peerIdDisplay');
        const qrcodeDiv = document.getElementById('qrcode');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        let modalResolve = null;

        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalOverlay.classList.remove('hidden');
            return new Promise((resolve) => {
                modalResolve = resolve;
            });
        }
        function hideModal(result) {
            modalOverlay.classList.add('hidden');
            if (modalResolve) {
                modalResolve(result);
                modalResolve = null;
            }
        }
        modalConfirmBtn.onclick = () => hideModal(true);
        modalCancelBtn.onclick = () => hideModal(false);

        function addLog(msg) {
            logBox.textContent += msg + '\n';
            logBox.scrollTop = logBox.scrollHeight;
        }
        function clearLog() { logBox.textContent = ''; }

        // ---------- 信令连接 ----------
        function connectSignaling() {
            if (!serverUrl) {
                addLog('[错误] 未设置服务器地址');
                return Promise.reject('no server');
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
            return new Promise((resolve, reject) => {
                ws = new WebSocket(`ws://${serverUrl}`);
                ws.onopen = () => {
                    serverConnected = true;
                    addLog('[信令] 连接成功');
                    resolve();
                };
                ws.onmessage = (e) => handleSignalingMessage(JSON.parse(e.data));
                ws.onclose = () => {
                    serverConnected = false;
                    addLog('[信令] 断开');
                };
                ws.onerror = (err) => {
                    addLog('[信令] 连接错误');
                    reject(err);
                };
            });
        }

        function handleSignalingMessage(msg) {
            addLog(`[信令收] ${msg.type} ${msg.from ? 'from '+msg.from : ''}`);
            if (msg.type === 'ok') {
                myId = msg.id;
                if (myIdDisplay) myIdDisplay.textContent = myId;
                addLog(`[信令] 我的ID: ${myId}`);
                if (radarView.style.display === 'flex' && publicIpInfo) {
                    ws.send(JSON.stringify({ type: 'report_public', payload: publicIpInfo }));
                }
            } else if (msg.type === 'same_network_clients') {
                peerNodes = msg.clients;
                updateRadarPeers();
                radarStatus.textContent = `发现 ${peerNodes.length} 个设备`;
            } else if (msg.type === 'new_peer') {
                if (!peerNodes.includes(msg.peer_id)) {
                    peerNodes.push(msg.peer_id);
                    updateRadarPeers();
                }
            } else if (msg.type === 'peer_left') {
                peerNodes = peerNodes.filter(id => id !== msg.peer_id);
                updateRadarPeers();
            } else if (msg.type === 'connect_request') {
                // 被动方收到连接请求
                handleConnectRequest(msg.from);
            } else if (msg.type === 'connect_accept') {
                // 主动方收到接受，开始交换
                startWebRTCAsInitiator(msg.from);
            } else if (msg.type === 'answer') {
                if (role === 'receiver') {
                    handleRemoteAnswerCompressed(msg.payload);
                }
            } else if (msg.type === 'offer') {
                // 被动方收到offer（在连接接受后）
                handleRemoteOfferCompressed(msg.payload, msg.from);
            } else if (msg.type === 'ice') {
                handleRemoteIce(msg.payload);
            }
        }

        async function handleConnectRequest(fromId) {
            const confirmed = await showModal('连接请求', `设备 ${fromId} 请求与您建立连接，是否接受？`);
            if (confirmed) {
                targetId = fromId;
                role = 'sender'; // 被动方作为answerer
                // 通知主动方已接受
                ws.send(JSON.stringify({ type: 'connect_accept', target: fromId }));
                addLog(`[连接] 已接受 ${fromId} 的连接请求`);
            }
        }

        async function startWebRTCAsInitiator(peerId) {
            targetId = peerId;
            role = 'receiver';
            radarStatus.textContent = `连接 ${peerId}...`;
            createPeerConnection();
            createDataChannel();
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await new Promise(resolve => {
                const check = () => {
                    if (pc.iceGatheringState === 'complete') resolve();
                    else setTimeout(check, 100);
                };
                check();
            });
            const sdp = pc.localDescription.sdp;
            const u = sdp.match(/a=ice-ufrag:(.+)/)[1];
            const p = sdp.match(/a=ice-pwd:(.+)/)[1];
            const f = sdp.match(/a=fingerprint:sha-256 (.+)/)[1];
            const iceCompact = localCandidates.map(c => {
                const parts = c.candidate.split(' ');
                const typIdx = parts.indexOf('typ');
                return { ip: parts[typIdx-2], port: parseInt(parts[typIdx-1]), type: parts[typIdx+1] };
            });
            ws.send(JSON.stringify({
                type: 'offer',
                target: peerId,
                payload: { u, p, f, ice: iceCompact }
            }));
            addLog(`[探查] 发送Offer给 ${peerId}`);
        }

        // ---------- WebRTC 核心 ----------
        function buildSDP(type, ufrag, pwd, fingerprint) {
            const sessionId = Math.floor(Math.random() * 1e18);
            return `v=0\r
o=- ${sessionId} 2 IN IP4 127.0.0.1\r
s=-\r
t=0 0\r
a=group:BUNDLE 0\r
a=extmap-allow-mixed\r
a=msid-semantic: WMS\r
m=application 9 UDP/DTLS/SCTP webrtc-datachannel\r
c=IN IP4 0.0.0.0\r
a=ice-ufrag:${ufrag}\r
a=ice-pwd:${pwd}\r
a=ice-options:trickle\r
a=fingerprint:sha-256 ${fingerprint}\r
a=setup:${type === 'offer' ? 'actpass' : 'active'}\r
a=mid:0\r
a=sctp-port:5000\r
a=max-message-size:262144\r
`;
        }

        function buildICECandidate(ip, port, type, ufrag) {
            const foundation = Math.floor(Math.random() * 2e9);
            const priority = (type === 'host') ? (ip.includes(':') ? 2113939711 : 2113937151) : 0;
            return `candidate:${foundation} 1 udp ${priority} ${ip} ${port} typ ${type} generation 0 ufrag ${ufrag} network-cost 999`;
        }

        function createPeerConnection() {
            if (pc) {
                pc.close();
                pc = null;
            }
            pendingIceCandidates = [];
            const iceServers = stunServer ? [{ urls: stunServer }] : [];
            pc = new RTCPeerConnection({ iceServers });
            
            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                addLog(`[连接状态] ${state}`);
                document.getElementById('connStateR').textContent = state;
                if (state === 'connected') {
                    showTransferAssistant();
                }
            };
            
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    localCandidates.push(e.candidate);
                    addLog(`[本地ICE] ${e.candidate.candidate}`);
                    if (ws && ws.readyState === WebSocket.OPEN && targetId) {
                        ws.send(JSON.stringify({
                            type: 'ice',
                            target: targetId,
                            payload: e.candidate.candidate
                        }));
                    }
                } else {
                    addLog('[ICE收集] 完成');
                    if (role === 'receiver' && genOfferSection.style.display === 'block') {
                        generateCompressedQR();
                    }
                }
            };
            
            pc.ondatachannel = (e) => {
                dc = e.channel;
                setupDataChannel(dc);
            };
            
            return pc;
        }

        function createDataChannel() {
            dc = pc.createDataChannel('fileTransfer');
            setupDataChannel(dc);
        }

        function setupDataChannel(channel) {
            channel.binaryType = 'arraybuffer';
            channel.onopen = () => {
                addLog('[数据通道] 已打开');
                addMessage('system', '数据通道已建立');
            };
            channel.onclose = () => addLog('[数据通道] 关闭');
            channel.onmessage = (e) => {
                if (typeof e.data === 'string') {
                    try {
                        const msg = JSON.parse(e.data);
                        if (msg.type === 'file-meta') {
                            receivedFileName = msg.name;
                            receivedFileSize = msg.size;
                            receiveBuffer = [];
                            addMessage('system', `准备接收: ${msg.name}`);
                        } else if (msg.type === 'file-end') {
                            const blob = new Blob(receiveBuffer);
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = receivedFileName;
                            a.click();
                            URL.revokeObjectURL(a.href);
                            addMessage('system', `接收完成`);
                        } else if (msg.type === 'chat') {
                            addMessage('peer', msg.text);
                        }
                    } catch(ex){}
                } else if (e.data instanceof ArrayBuffer) {
                    receiveBuffer.push(e.data);
                }
            };
        }

        async function generateOffer() {
            if (pc) pc.close();
            localCandidates = [];
            createPeerConnection();
            createDataChannel();
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            addLog('[Offer] 已创建，等待ICE收集...');
        }

        function generateCompressedQR() {
            if (!pc || !pc.localDescription) return;
            const sdp = pc.localDescription.sdp;
            const u = sdp.match(/a=ice-ufrag:(.+)/)[1];
            const p = sdp.match(/a=ice-pwd:(.+)/)[1];
            const f = sdp.match(/a=fingerprint:sha-256 (.+)/)[1];
            const iceCompact = localCandidates.map(c => {
                const parts = c.candidate.split(' ');
                const typIdx = parts.indexOf('typ');
                return { ip: parts[typIdx-2], port: parseInt(parts[typIdx-1]), type: parts[typIdx+1] };
            });
            const compressed = { id: myId, u, p, f, ice: iceCompact };
            qrcodeDiv.innerHTML = '';
            QRCode.toCanvas(document.createElement('canvas'), JSON.stringify(compressed), { width: 300 }, (err, canvas) => {
                if (err) return;
                qrcodeDiv.appendChild(canvas);
                addLog('[二维码] 已生成');
            });
        }

        async function handleScannedCompressed(compressedStr) {
            try {
                const data = JSON.parse(compressedStr);
                targetId = data.id;
                role = 'sender';
                const { u, p, f, ice } = data;
                const offerSdp = buildSDP('offer', u, p, f);
                createPeerConnection();
                await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
                // 添加远程ICE
                for (const ic of ice) {
                    await pc.addIceCandidate({ candidate: buildICECandidate(ic.ip, ic.port, ic.type, u), sdpMid: '0', sdpMLineIndex: 0 });
                }
                // 添加缓存ICE
                while (pendingIceCandidates.length) {
                    const cand = pendingIceCandidates.shift();
                    await pc.addIceCandidate({ candidate: cand, sdpMid: '0', sdpMLineIndex: 0 }).catch(e=>addLog('[缓存ICE添加失败] '+e));
                }
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                const ansSdp = answer.sdp;
                const ansU = ansSdp.match(/a=ice-ufrag:(.+)/)[1];
                const ansP = ansSdp.match(/a=ice-pwd:(.+)/)[1];
                const ansF = ansSdp.match(/a=fingerprint:sha-256 (.+)/)[1];
                const answerCompressed = { u: ansU, p: ansP, f: ansF, ice: [] };
                ws.send(JSON.stringify({ type: 'answer', target: targetId, payload: answerCompressed }));
                addLog('[发送Answer] 完成');
            } catch (e) {
                addLog('[扫描处理错误] ' + e);
            }
        }

        async function handleRemoteAnswerCompressed(compressed) {
            const { u, p, f } = compressed;
            const answerSdp = buildSDP('answer', u, p, f);
            await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
            addLog('[设置远程Answer] 成功');
            // 添加缓存ICE
            while (pendingIceCandidates.length) {
                const cand = pendingIceCandidates.shift();
                await pc.addIceCandidate({ candidate: cand, sdpMid: '0', sdpMLineIndex: 0 }).catch(e=>addLog('[缓存ICE添加失败] '+e));
            }
        }

        async function handleRemoteOfferCompressed(compressed, fromId) {
            addLog(`[探查] 处理来自 ${fromId} 的offer`);
            targetId = fromId;
            role = 'sender';
            const { u, p, f, ice } = compressed;
            const offerSdp = buildSDP('offer', u, p, f);
            createPeerConnection();
            await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
            for (const ic of ice) {
                await pc.addIceCandidate({ candidate: buildICECandidate(ic.ip, ic.port, ic.type, u), sdpMid: '0', sdpMLineIndex: 0 });
            }
            while (pendingIceCandidates.length) {
                const cand = pendingIceCandidates.shift();
                await pc.addIceCandidate({ candidate: cand, sdpMid: '0', sdpMLineIndex: 0 }).catch(e=>addLog('[缓存ICE添加失败] '+e));
            }
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            const ansSdp = answer.sdp;
            const ansU = ansSdp.match(/a=ice-ufrag:(.+)/)[1];
            const ansP = ansSdp.match(/a=ice-pwd:(.+)/)[1];
            const ansF = ansSdp.match(/a=fingerprint:sha-256 (.+)/)[1];
            await new Promise(r => setTimeout(r, 500));
            const answerCompressed = { u: ansU, p: ansP, f: ansF };
            ws.send(JSON.stringify({ type: 'answer', target: targetId, payload: answerCompressed }));
            addLog(`[探查] 发送Answer给 ${targetId}`);
        }

        async function handleRemoteIce(candidateStr) {
            if (!pc) return;
            if (pc.remoteDescription && pc.remoteDescription.type) {
                try {
                    await pc.addIceCandidate({ candidate: candidateStr, sdpMid: '0', sdpMLineIndex: 0 });
                    addLog('[添加远程ICE] 成功');
                } catch (e) {
                    addLog('[添加远程ICE失败] ' + e);
                }
            } else {
                // 缓存ICE
                pendingIceCandidates.push(candidateStr);
                addLog('[ICE缓存] 等待远程描述');
            }
        }

        // 传输助手
        function showTransferAssistant() {
            transferAssistant.style.display = 'flex';
            peerIdDisplay.textContent = `与 ${targetId || '对方'} 连接中`;
        }

        function addMessage(sender, text) {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble' + (sender === 'self' ? ' self' : '');
            bubble.textContent = text;
            messageList.appendChild(bubble);
            messageList.scrollTop = messageList.scrollHeight;
        }

        function sendChatMessage() {
            const text = messageInput.value.trim();
            if (!text || !dc || dc.readyState !== 'open') return;
            dc.send(JSON.stringify({ type: 'chat', text }));
            addMessage('self', text);
            messageInput.value = '';
        }

        function sendFile(file) {
            if (!dc || dc.readyState !== 'open') return;
            dc.send(JSON.stringify({type:'file-meta', name:file.name, size:file.size}));
            const chunkSize = 16*1024;
            let offset = 0;
            const reader = new FileReader();
            reader.onload = (e) => {
                dc.send(e.target.result);
                offset += e.target.result.byteLength;
                if (offset < file.size) readNext();
                else { dc.send(JSON.stringify({type:'file-end'})); addMessage('system', `发送完成`); }
            };
            const readNext = () => reader.readAsArrayBuffer(file.slice(offset, offset+chunkSize));
            readNext();
        }

        // 雷达
        async function startRadarMode() {
            radarView.style.display = 'flex';
            radarStatus.textContent = '获取网络信息...';
            const iceServers = stunServer ? [{ urls: stunServer }] : [];
            const pcTemp = new RTCPeerConnection({ iceServers });
            pcTemp.createDataChannel('dummy');
            const offer = await pcTemp.createOffer();
            await pcTemp.setLocalDescription(offer);
            const iceCandidate = await new Promise((resolve) => {
                pcTemp.onicecandidate = (e) => {
                    if (e.candidate && e.candidate.candidate.includes('srflx')) resolve(e.candidate);
                };
                setTimeout(() => resolve(null), 3000);
            });
            pcTemp.close();
            if (iceCandidate) {
                const parts = iceCandidate.candidate.split(' ');
                publicIpInfo = { public_ip: parts[4], public_port: parseInt(parts[5]) };
                radarStatus.textContent = `公网: ${parts[4]}:${parts[5]}`;
            } else {
                publicIpInfo = { public_ip: 'unknown', public_port: 0 };
            }
            await connectSignaling();
        }

        function updateRadarPeers() {
            const group = peersGroup;
            group.innerHTML = '';
            const center = { x: 200, y: 200 };
            const radius = 140;
            peerNodes.forEach((pid, index) => {
                const angle = (index / Math.max(peerNodes.length, 1)) * 2 * Math.PI;
                const x = center.x + radius * Math.cos(angle);
                const y = center.y + radius * Math.sin(angle);
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', '20');
                circle.setAttribute('fill', '#0d9488');
                circle.setAttribute('stroke', '#5eead4');
                circle.setAttribute('stroke-width', '2');
                circle.setAttribute('class', 'peer-node');
                circle.setAttribute('data-id', pid);
                circle.addEventListener('click', () => requestConnection(pid));
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y+5);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', 'white');
                text.setAttribute('font-size', '12');
                text.textContent = pid;
                group.appendChild(circle);
                group.appendChild(text);
            });
        }

        async function requestConnection(peerId) {
            const confirmed = await showModal('发起连接', `确定要连接设备 ${peerId} 吗？`);
            if (confirmed) {
                targetId = peerId;
                ws.send(JSON.stringify({ type: 'connect_request', target: peerId }));
                radarStatus.textContent = `已发送连接请求给 ${peerId}，等待接受...`;
            }
        }

        // 扫描
        async function startScan() {
            try {
                await connectSignaling();
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.style.display = 'block';
                video.play();
                scanningActive = true;
                scanLoop();
            } catch(e) {
                alert('摄像头或信令连接失败，请到高级功能调整');
            }
        }

        function scanLoop() {
            if (!scanningActive) return;
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);
                if (code) {
                    scanningActive = false;
                    video.srcObject.getTracks().forEach(t => t.stop());
                    video.style.display = 'none';
                    document.getElementById('scanResult').textContent = '✅ 扫描成功';
                    handleScannedCompressed(code.data);
                    return;
                }
            }
            requestAnimationFrame(scanLoop);
        }

        // ---------- UI 绑定 ----------
        advancedBtn.onclick = () => advancedPanel.classList.toggle('show');
        applyServerBtn.onclick = () => {
            serverUrl = serverUrlInput.value.trim();
            addLog(`信令服务器: ${serverUrl}`);
        };
        applyStunBtn.onclick = () => {
            stunServer = stunServerInput.value.trim();
            addLog(`STUN服务器: ${stunServer}`);
        };

        document.getElementById('qrQuickCard').onclick = () => {
            qrQuickPanel.style.display = 'block';
            genOfferSection.style.display = 'none';
            scanSection.style.display = 'none';
        };
        document.getElementById('closeQrPanelBtn').onclick = () => {
            qrQuickPanel.style.display = 'none';
        };

        document.getElementById('showGenOfferBtn').onclick = async () => {
            qrQuickPanel.style.display = 'none';
            genOfferSection.style.display = 'block';
            role = 'receiver';
            try {
                await connectSignaling();
                // 自动生成一次二维码
                qrcodeDiv.innerHTML = '';
                await generateOffer();
            } catch(e) {
                alert('连接信令服务器失败，请到高级功能调整');
            }
        };

        document.getElementById('showScanBtn').onclick = () => {
            qrQuickPanel.style.display = 'none';
            scanSection.style.display = 'block';
        };

        document.getElementById('genOfferBtn').onclick = async () => {
            qrcodeDiv.innerHTML = '';
            await generateOffer();
        };

        document.getElementById('cancelGenOfferBtn').onclick = () => {
            genOfferSection.style.display = 'none';
            if (pc) pc.close();
        };

        document.getElementById('startScanBtn').onclick = startScan;
        document.getElementById('cancelScanBtn').onclick = () => {
            scanSection.style.display = 'none';
            scanningActive = false;
            const video = document.getElementById('video');
            if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        };

        document.getElementById('radarCard').onclick = async () => {
            try {
                await startRadarMode();
            } catch(e) {
                alert('连接失败，请到高级功能调整信令服务器');
            }
        };

        document.getElementById('closeRadarBtn').onclick = () => {
            radarView.style.display = 'none';
            if (ws) ws.close();
        };

        document.getElementById('closeTransferBtn').onclick = () => {
            transferAssistant.style.display = 'none';
            if (pc) pc.close();
        };

        sendMessageBtn.onclick = sendChatMessage;
        messageInput.addEventListener('keypress', (e) => { if(e.key==='Enter') sendChatMessage(); });
        fileInput.onchange = (e) => {
            if (fileInput.files.length) sendFile(fileInput.files[0]);
            fileInput.value = '';
        };

        clearLog();
        addLog('🌐 就绪，点击功能卡片开始');
    })();
</script>
</body>
