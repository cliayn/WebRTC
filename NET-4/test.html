<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 纯 IPv6-STUN 连通测试</title>
    <style>
        body { font-family: monospace; margin: 20px; background-color: #f4f4f9; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; }
        #chatBox { height: 150px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background: #fafafa;}
        .log-good { color: green; }
        .log-bad { color: red; }
        .log-sys { color: blue; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-size: 12px; background: #eee; padding: 5px; }
    </style>
</head>
<body>

    <h2>WebRTC 纯 IPv6 P2P 连通性测试 (仅限 STUN srflx)</h2>
    <div style="margin-bottom: 20px;">
        <button id="btnConnect" onclick="startConnection()">1. 作为发起方呼叫 (Offer)</button>
        <span id="status" style="margin-left: 15px; font-weight: bold;">状态: 等待连接信令服务器...</span>
    </div>

    <div class="container">
        <div class="panel">
            <h3>数据通道 (Data Channel)</h3>
            <div id="chatBox"></div>
            <input type="text" id="msgInput" placeholder="输入测试消息..." style="width: 70%; padding: 5px;">
            <button onclick="sendMessage()" id="btnSend" disabled>发送</button>
        </div>

        <div class="panel">
            <h3>ICE 候选者过滤日志</h3>
            <div id="iceLog" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: #222; color: #0f0;">
                </div>
        </div>
    </div>

<script>
    // --- 配置区 ---
    // 替换为你 Python 信令服务器的 IP 和端口
    const SIGNALING_SERVER_URL = "ws://192.168.43.15:8765"; 
    
    // STUN 服务器配置。使用 Google 的公开 STUN。
    // 如果你在国内，且 Google 不通，可以尝试 stun:stun.qq.com:3478
    const rtcConfig = {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun.qq.com:3478" }
        ]
    };

    let ws;
    let pc;
    let dataChannel;

    // UI 元素
    const statusEl = document.getElementById('status');
    const iceLogEl = document.getElementById('iceLog');
    const chatBoxEl = document.getElementById('chatBox');
    const btnSend = document.getElementById('btnSend');
    const msgInput = document.getElementById('msgInput');

    function logICE(msg, type) {
        const div = document.createElement('div');
        div.textContent = msg;
        if(type === 'pass') div.style.color = '#0f0'; // 绿色
        if(type === 'drop') div.style.color = '#f00'; // 红色
        if(type === 'info') div.style.color = '#0ff'; // 青色
        iceLogEl.appendChild(div);
        iceLogEl.scrollTop = iceLogEl.scrollHeight;
    }

    function logChat(msg, sender) {
        const div = document.createElement('div');
        div.innerHTML = `<b>${sender}:</b> ${msg}`;
        chatBoxEl.appendChild(div);
        chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    // 1. 初始化信令 WebSocket
    function initSignaling() {
        ws = new WebSocket(SIGNALING_SERVER_URL);
        
        ws.onopen = () => {
            statusEl.textContent = "状态: 信令服务器已连接，等待操作";
            statusEl.className = "log-sys";
        };

        ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            
            if (!pc) initPeerConnection();

            if (message.type === 'offer') {
                logICE("收到 Offer", "info");
                await pc.setRemoteDescription(new RTCSessionDescription(message));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify(pc.localDescription));
            } 
            else if (message.type === 'answer') {
                logICE("收到 Answer", "info");
                await pc.setRemoteDescription(new RTCSessionDescription(message));
            } 
            else if (message.type === 'candidate') {
                logICE(`收到远端候选者: ${message.candidate.address}`, "info");
                await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
            }
        };

        ws.onclose = () => {
            statusEl.textContent = "状态: 信令服务器断开";
            statusEl.className = "log-bad";
        };
    }

    // 2. 初始化 WebRTC PeerConnection
    function initPeerConnection() {
        pc = new RTCPeerConnection(rtcConfig);

        // 监听连接状态变化
        pc.oniceconnectionstatechange = () => {
            statusEl.textContent = `状态: WebRTC P2P 连接 -> ${pc.iceConnectionState}`;
            if(pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                statusEl.className = "log-good";
            } else if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
                statusEl.className = "log-bad";
            }
        };

        // 【核心逻辑】拦截并过滤 ICE 候选者
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                const candidate = event.candidate;
                const type = candidate.type;       // 'host', 'srflx', 'prflx', 'relay'
                const address = candidate.address; // IP 地址

                // 检查是否为 IPv6 (包含冒号) 且不包含点 (排除 IPv4-mapped IPv6)
                const isIPv6 = address.includes(':') && !address.includes('.');
                // 检查是否为 STUN 穿透获得的公网地址
                const isSrflx = type === 'srflx';

                if (isIPv6 && isSrflx) {
                    logICE(`[放行] 符合条件 (IPv6 + STUN): ${address}`, "pass");
                    // 只有符合条件的才发给信令服务器
                    ws.send(JSON.stringify({
                        type: 'candidate',
                        candidate: candidate
                    }));
                } else {
                    let reason = "";
                    if (!isIPv6) reason += "非纯IPv6 ";
                    if (!isSrflx) reason += `类型为${type} `;
                    logICE(`[丢弃] ${address} -> 原因: ${reason}`, "drop");
                }
            } else {
                logICE("ICE 候选者收集完成", "info");
            }
        };

        // 处理远端数据通道
        pc.ondatachannel = (event) => {
            dataChannel = event.channel;
            setupDataChannel();
        };
    }

    // 设置数据通道的事件监听
    function setupDataChannel() {
        dataChannel.onopen = () => {
            logChat("DataChannel 已连接，可以开始发送数据了！", "System");
            btnSend.disabled = false;
        };
        dataChannel.onmessage = (event) => {
            logChat(event.data, "远端");
        };
        dataChannel.onclose = () => {
            logChat("DataChannel 已关闭", "System");
            btnSend.disabled = true;
        };
    }

    // 3. 作为发起方启动连接
    async function startConnection() {
        if (!pc) initPeerConnection();

        // 创建数据通道 (只有发起方需要显式创建，接收方通过 ondatachannel 接收)
        dataChannel = pc.createDataChannel("chat");
        setupDataChannel();

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify(pc.localDescription));
        logICE("已发送 Offer", "info");
    }

    // 4. UI 交互: 发送消息
    function sendMessage() {
        const msg = msgInput.value;
        if (msg && dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(msg);
            logChat(msg, "我");
            msgInput.value = '';
        }
    }

    // 页面加载时连接信令
    window.onload = initSignaling;
</script>

</body>
</html>
