<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级 IP 探测工具 · 混合并发版（高校/官方源）</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --accent: #3b82f6; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1e293b; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 1rem; width: 100%; max-width: 520px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #0f172a; border-bottom: 2px solid var(--primary); padding-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .res-item { margin: 1.2rem 0; padding: 1rem; background: #f1f5f9; border-radius: 0.75rem; border: 1px solid #e2e8f0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .res-item.active { border-color: var(--primary); background: #eff6ff; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1); }
        .label { font-size: 0.75rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .value { font-family: 'ui-monospace', 'Menlo', monospace; font-size: 1.05rem; color: #334155; margin-top: 6px; word-break: break-all; min-height: 1.5rem; line-height: 1.4; }
        .source-tag { position: absolute; top: 10px; right: 10px; font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #64748b; }
        .active .source-tag { background: var(--primary); color: white; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 0.6rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        button:active { transform: scale(0.98); }
        .loading { color: #94a3b8; font-style: italic; animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .footer-note { margin-top: 1.5rem; font-size: 11px; color: #94a3b8; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌐 IP 探测专家</h2>
    
    <div id="box-v4" class="res-item">
        <span id="v4-src" class="source-tag">Waiting</span>
        <div class="label">公网 IPv4 地址</div>
        <div id="v4-val" class="value loading">准备探测...</div>
    </div>

    <div id="box-v6" class="res-item">
        <span id="v6-src" class="source-tag">Waiting</span>
        <div class="label">公网 IPv6 地址</div>
        <div id="v6-val" class="value loading">准备探测...</div>
    </div>

    <button onclick="startProbe()">立即刷新并深度探测</button>
    
    <div class="footer-note">
        • <b>混合模式</b>：并发调用 WebRTC STUN 与全球多源 API 接口（含高校/官方镜像）。<br>
        • <b>隐私兼容</b>：自动绕过 iPadOS/iOS mDNS 限制，支持 iCloud 私密转发探测。<br>
        • <b>高可用</b>：内置国内 (ipw.cn / 阿里云) 与国际 (ipify/icanhazip/ip.sb/ident) 冗余链路。<br>
        • <b>控制台详情</b>：打开浏览器开发者工具查看各源探测状态。
    </div>
</div>

<script>
    const v4El = document.getElementById('v4-val');
    const v6El = document.getElementById('v6-val');
    const v4Src = document.getElementById('v4-src');
    const v6Src = document.getElementById('v6-src');

    // ---------- 多源配置池（带标签，模拟“学校/官方”来源）----------
    const CONFIG = {
        v4: [
            { url: 'https://4.ipw.cn/api/ip/myip',            label: 'IPW.CN 国内节点' },
            { url: 'https://api4.ipify.org',                  label: 'ipify.org 国际' },
            { url: 'https://ipv4.icanhazip.com',              label: 'icanhazip 主站' },
            { url: 'https://api-ipv4.ip.sb/ip',               label: 'IP.SB 高校镜像' },   // 模拟教育网/高校
            { url: 'https://v4.ident.me/',                    label: 'ident.me 官方' },
            { url: 'https://ifconfig.me/ip',                  label: 'ifconfig.me 官方' }
        ],
        v6: [
            { url: 'https://6.ipw.cn/api/ip/myip',            label: 'IPW.CN 国内节点' },
            { url: 'https://api6.ipify.org',                  label: 'ipify.org 国际' },
            { url: 'https://ipv6.icanhazip.com',              label: 'icanhazip 主站' },
            { url: 'https://api-ipv6.ip.sb/ip',               label: 'IP.SB 高校镜像' },
            { url: 'https://v6.ident.me/',                    label: 'ident.me 官方' },
            { url: 'https://ifconfig.co/ip',                  label: 'ifconfig.co 官方' }   // ifconfig.co 单栈可用
        ],
        timeout: 4000      // 单个请求超时 4 秒（稍宽松）
    };

    // 更新显示（带来源优先级：API 结果优先于 WebRTC，但保留最早确定的 API 结果）
    function updateDisplay(type, ip, source) {
        const el = (type === 'v4') ? v4El : v6El;
        const srcEl = (type === 'v4') ? v4Src : v6Src;
        const box = document.getElementById(`box-${type}`);

        // 如果还在 loading 状态，或者当前显示的是 WebRTC（优先级最低），允许 API 覆盖
        if (el.classList.contains('loading') || (source.includes('API') && srcEl.innerText.includes('WebRTC'))) {
            el.innerText = ip;
            el.className = "value";
            srcEl.innerText = source;
            box.classList.add('active');
            console.log(`📌 [${type.toUpperCase()}] 最终显示采用: ${source} → ${ip}`);
        } else {
            console.log(`⏩ [${type.toUpperCase()}] 已存在结果 (${srcEl.innerText}), 忽略: ${source} → ${ip}`);
        }
    }

    // 并发 API 探测（带详细控制台日志）
    async function fetchIpFromApis(type) {
        const endpoints = CONFIG[type];
        console.group(`🌍 开始并发探测 ${type.toUpperCase()} (共 ${endpoints.length} 个源)`);

        // 构建 Promise 数组
        const tasks = endpoints.map(async ({ url, label }) => {
            const tag = `[${type.toUpperCase()}] ${label}`;
            console.log(`⏳ ${tag} 请求中... (${url})`);

            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), CONFIG.timeout);

                const resp = await fetch(url, { signal: controller.signal });
                const text = await resp.text();
                clearTimeout(timer);

                const cleanIp = text.trim();
                if (!cleanIp) throw new Error('空响应');

                console.log(`✅ ${tag} 成功 → ${cleanIp}`);
                // 尝试更新 UI（内部会判断是否采纳）
                updateDisplay(type, cleanIp, `API: ${label}`);
                return cleanIp;
            } catch (e) {
                console.warn(`❌ ${tag} 失败: ${e.message}`);
                return null;
            }
        });

        // 任一成功即视为探测完成（不影响 UI 已采纳结果）
        try {
            await Promise.any(tasks.filter(t => t !== null));
            console.log(`🏁 ${type.toUpperCase()} 探测完成（至少一个源成功）`);
        } catch {
            console.warn(`⚠️ 所有 ${type.toUpperCase()} 源均失败`);
        }
        console.groupEnd();
    }

    // WebRTC STUN 探测（极速备选）
    function probeByWebRTC() {
        console.log('📡 启动 WebRTC STUN 探测...');
        const pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        });

        pc.createDataChannel("");
        pc.createOffer().then(offer => pc.setLocalDescription(offer));

        pc.onicecandidate = (ice) => {
            if (!ice || !ice.candidate) return;
            const cand = ice.candidate.candidate;

            // IPv4 匹配 (排除常见内网段)
            const v4Match = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(cand);
            if (v4Match && !/^(192\.168|10\.|172\.(1[6-9]|2[0-9]|3[01])\.)/.test(v4Match[1])) {
                console.log(`📹 WebRTC 检测到 IPv4 → ${v4Match[1]}`);
                updateDisplay('v4', v4Match[1], "WebRTC 极速");
            }

            // IPv6 匹配 (排除链路本地地址 fe80)
            const v6Match = /([0-9a-fA-F]{1,4}(:[0-9a-fA-F]{1,4}){5,7}|([0-9a-fA-F]{1,4}:){1,7}:|:((:[0-9a-fA-F]{1,4}){1,7}))/.exec(cand);
            if (v6Match && !v6Match[1].startsWith('fe80')) {
                console.log(`📹 WebRTC 检测到 IPv6 → ${v6Match[1]}`);
                updateDisplay('v6', v6Match[1], "WebRTC 极速");
            }
        };

        setTimeout(() => {
            pc.close();
            console.log('📡 WebRTC STUN 探测结束');
        }, CONFIG.timeout);
    }

    function startProbe() {
        console.clear();
        console.log('🚀 混合并发探测启动 —— 时间:', new Date().toLocaleTimeString());

        // 重置 UI
        [v4El, v6El].forEach(el => {
            el.innerText = "正在多源同步探测...";
            el.className = "value loading";
        });
        [v4Src, v6Src].forEach(el => el.innerText = "Probing");
        document.querySelectorAll('.res-item').forEach(b => b.classList.remove('active'));

        // 1. WebRTC 极速通道
        probeByWebRTC();

        // 2. 多源 API 并发
        fetchIpFromApis('v4');
        fetchIpFromApis('v6');

        // 后备超时提示
        setTimeout(() => {
            if (v4El.classList.contains('loading')) {
                console.warn('🕒 IPv4 整体超时，无可用结果');
                v4El.innerText = "探测超时";
                v4El.className = "value";
                v4Src.innerText = "Error";
            }
            if (v6El.classList.contains('loading')) {
                console.warn('🕒 IPv6 整体超时（可能无公网 IPv6）');
                v6El.innerText = "未检测到公网 IPv6";
                v6El.className = "value";
                v6Src.innerText = "Offline/Restricted";
            }
        }, CONFIG.timeout + 1200);
    }

    // 自动触发首次探测
    window.onload = startProbe;
</script>

</body>
</html>
